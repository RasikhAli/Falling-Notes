<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12" />
      <stop offset="100%" stop-color="#161526" />
    </linearGradient>

    <!-- Amber Glow (Harmonium & Falling Bars) -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cyan Glow (Piano Falling Bars) -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- White Key Gradient -->
    <linearGradient id="whiteKeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="90%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Falling Note Bars (Cascade) -->
  <!-- Cyan falling bar 1 -->
  <rect x="12" y="8" width="5" height="18" rx="2.5" fill="url(#cyanGlow)" filter="url(#glow)" opacity="0.95" />
  <!-- Amber falling bar 2 (Harmonium gold) -->
  <rect x="23" y="4" width="5" height="24" rx="2.5" fill="url(#amberGlow)" filter="url(#glow)" opacity="1" />
  <!-- Magenta/Purple falling bar 3 -->
  <rect x="36" y="10" width="5" height="16" rx="2.5" fill="#ec4899" filter="url(#glow)" opacity="0.9" />
  <!-- Amber falling bar 4 -->
  <rect x="47" y="6" width="5" height="22" rx="2.5" fill="url(#amberGlow)" filter="url(#glow)" opacity="0.95" />

  <!-- Hit line / keyboard boundary glow -->
  <line x1="8" y1="36" x2="56" y2="36" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 1" />

  <!-- Piano / Harmonium Keyboard at Bottom -->
  <g id="keyboard" transform="translate(7, 36)">
    <!-- White Keys -->
    <rect x="0" y="0" width="6.5" height="22" rx="1.5" fill="url(#whiteKeyGrad)" stroke="#1e293b" stroke-width="0.8" />
    <rect x="7" y="0" width="6.5" height="22" rx="1.5" fill="url(#whiteKeyGrad)" stroke="#1e293b" stroke-width="0.8" />
    <!-- Active Hit Key (Gold Glow) -->
    <rect x="14" y="0" width="6.5" height="22" rx="1.5" fill="#fef08a" stroke="#d97706" stroke-width="0.8" />
    <rect x="21" y="0" width="6.5" height="22" rx="1.5" fill="url(#whiteKeyGrad)" stroke="#1e293b" stroke-width="0.8" />
    <rect x="28" y="0" width="6.5" height="22" rx="1.5" fill="url(#whiteKeyGrad)" stroke="#1e293b" stroke-width="0.8" />
    <!-- Active Hit Key (Cyan Glow) -->
    <rect x="35" y="0" width="6.5" height="22" rx="1.5" fill="#a5f3fc" stroke="#0891b2" stroke-width="0.8" />
    <rect x="42" y="0" width="6.5" height="22" rx="1.5" fill="url(#whiteKeyGrad)" stroke="#1e293b" stroke-width="0.8" />

    <!-- Black Keys -->
    <rect x="4.5" y="0" width="4.2" height="13" rx="1" fill="#0f172a" />
    <rect x="11.5" y="0" width="4.2" height="13" rx="1" fill="#0f172a" />
    <rect x="25.5" y="0" width="4.2" height="13" rx="1" fill="#0f172a" />
    <rect x="32.5" y="0" width="4.2" height="13" rx="1" fill="#0f172a" />
    <rect x="39.5" y="0" width="4.2" height="13" rx="1" fill="#0f172a" />
  </g>

  <!-- Glowing hit sparks at contact point -->
  <circle cx="24" cy="36" r="2.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="45" cy="36" r="2" fill="#ffffff" filter="url(#glow)" />
</svg>